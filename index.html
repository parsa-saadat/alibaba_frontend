<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff6a00" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:image" content="/logo.png" />
    <title>GeoCala | B2B Surveying Platform</title>
    <meta
      name="description"
      content="ژئوکالا، پلتفرم B2B معرفی فروشندگان و محصولات تجهیزات نقشه‌برداری؛ بستری برای ارتباط تجاری کسب‌وکارها."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ژئوکالا" />
    <meta property="og:title" content="GeoCala | B2B Surveying Platform" />
    <meta
      property="og:description"
      content="ژئوکالا، پلتفرم B2B معرفی فروشندگان و محصولات تجهیزات نقشه‌برداری."
    />
    <style>
      html,
      body {
        margin: 0;
        background: #242424;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 15%, rgba(255, 106, 0, 0.14), transparent 55%),
          linear-gradient(135deg, #292929, #242424);
        font-family: Vazirmatn, Tahoma, sans-serif;
        direction: inherit;
        color: #f5f5f5;
        z-index: 9999;
      }
      #boot-splash .boot-card {
        text-align: center;
        padding: 24px;
        max-width: 420px;
      }
      #boot-splash b {
        display: block;
        font-size: 20px;
        font-weight: 900;
        margin-top: 18px;
        letter-spacing: 0.02em;
      }
      #boot-splash p {
        margin: 8px 0 0;
        font-size: 12px;
        color: #a8a8a8;
        line-height: 2;
      }
      #boot-splash .boot-ring {
        width: 54px;
        height: 54px;
        margin: 0 auto;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #ff6a00;
        animation: boot-spin 0.9s linear infinite;
      }
      #boot-splash .boot-ring span {
        display: none;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- لودینگ اولیه؛ به‌محض بالا آمدن React خودکار جایگزین می‌شود -->
      <div id="boot-splash" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-ring"><span></span></div>
          <b>GeoCala</b>
          <p id="boot-splash-text">Loading…</p>
        </div>
      </div>
    </div>

    <!--
      شبکه‌ی اطمینان: اگر به هر دلیلی (خطای بارگذاری ماژول، مسدود بودن حافظه و…)
      React بالا نیامد، به‌جای صفحه‌ی سفید یک پیام روشن با دکمه‌ی تلاش دوباره نشان می‌دهیم.
    -->
    <script>
      (function () {
        var bootLang = 'en';
        try {
          bootLang = localStorage.getItem('app.language') || 'en';
        } catch (e) {}
        var bootMessages = {
          en: [
            'Loading…',
            'Connection is slow. Please wait…',
            'Loading took too long. Reload the page.',
          ],
          fa: [
            'در حال بارگذاری…',
            'اتصال کند است؛ لطفاً صبر کنید…',
            'بارگذاری طول کشید؛ صفحه را دوباره بارگذاری کنید.',
          ],
          ar: [
            'جارٍ التحميل…',
            'الاتصال بطيء، يرجى الانتظار…',
            'استغرق التحميل وقتاً طويلاً. أعد تحميل الصفحة.',
          ],
          tr: [
            'Yükleniyor…',
            'Bağlantı yavaş. Lütfen bekleyin…',
            'Yükleme uzun sürdü. Sayfayı yenileyin.',
          ],
        };
        var bootText = bootMessages[bootLang] || bootMessages.en;
        document.documentElement.lang = bootMessages[bootLang] ? bootLang : 'en';
        document.documentElement.dir = ['fa', 'ar'].indexOf(bootLang) >= 0 ? 'rtl' : 'ltr';
        document.getElementById('boot-splash-text').textContent = bootText[0];
        var lastError = '';
        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            if (target && (target.src || target.href)) {
              lastError = 'بارگذاری ' + (target.src || target.href) + ' ناموفق بود';
            } else if (event && event.message) {
              lastError = event.message;
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          lastError = (reason && (reason.message || String(reason))) || lastError;
        });

        /*
         * ترمیم خودکار: اگر مرورگر نسخه‌ی قدیمیِ ماژول‌ها را نگه داشته باشد، خطاهایی
         * مثل «Invalid hook call» یا «reading 'useState' of null» رخ می‌دهد.
         * یک‌بار (و فقط یک‌بار برای هر تب) صفحه را با آدرس تازه دوباره بارگذاری می‌کنیم.
         */
        var hookErrorPattern =
          /Invalid hook call|reading 'useState'|does not provide an export named/;
        function autoRepair(message) {
          if (!hookErrorPattern.test(String(message || ''))) return;
          try {
            if (sessionStorage.getItem('geokala_self_repair') === '1') return;
            sessionStorage.setItem('geokala_self_repair', '1');
          } catch (e) {
            /* اگر sessionStorage نبود، برای جلوگیری از حلقه، کاری نمی‌کنیم */
            return;
          }
          var url = new URL(window.location.href);
          url.searchParams.set('reload', String(Date.now()));
          window.location.replace(url.toString());
        }
        window.addEventListener('error', function (event) {
          autoRepair((event && event.message) || (event && event.error && event.error.message));
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          autoRepair(reason && (reason.message || String(reason)));
        });

        /* اگر بارگذاری کند بود، فقط یک پیام دلگرم‌کننده نشان بده (نه خطا) */
        setTimeout(function () {
          var hint = document.getElementById('boot-splash-text');
          if (hint) hint.textContent = bootText[1];
        }, 7000);

        /* خطای نهایی فقط اگر بعد از ۶۰ ثانیه هنوز اسپلش روی صفحه باشد */
        setTimeout(function () {
          var root = document.getElementById('boot-splash');
          if (!root) return;
          var hint = document.getElementById('boot-splash-text');
          if (hint) hint.textContent = bootText[2];
        }, 60000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
